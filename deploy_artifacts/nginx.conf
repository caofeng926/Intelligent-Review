# Nginx 反代 + TLS 终止 (audit 2026-09-03 C2)
# - 不直接暴露 gunicorn 到公网
# - TLS 1.2+ only, Mozilla intermediate cipher list
# - 安全头 (虽然 Talisman 也会发, 这里再加一层兜底)
# - rate limit zone 防止单 IP 暴力
#
# 安装: 见 setup_nginx.sh

# ---- HTTP → HTTPS 重定向 ----
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # acme.sh challenge 路径必须放行 (HTTP-01 验证)
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    # 其他全部 301 → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 入口 ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # TLS 证书 (acme.sh 生成到 /etc/nginx/ssl/)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # TLS 协议与密码套件 (Mozilla intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # 上传大小 (允许 kp.db 上传同步用,生产 50 MB 上限)
    client_max_body_size 500m;

    # 访问/错误日志
    access_log /var/log/nginx/medical-audit.access.log;
    error_log  /var/log/nginx/medical-audit.error.log;

    # 限速 zone (audit H1): 单 IP 10 r/s 突发, 50 MB/min
    limit_req_zone $binary_remote_addr zone=ma_limit:10m rate=10r/s;
    limit_req zone=ma_limit burst=20 nodelay;
    limit_conn_zone $binary_remote_addr zone=ma_conn:10m;
    limit_conn ma_conn 50;

    # 安全响应头 (audit H2 - 兜底层)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 代理到 Gunicorn (localhost:5000, systemd 限制了只本机)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 静态资源缓存
    location /static/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_cache_valid 200 60s;
        add_header Cache-Control "public, max-age=60" always;
    }

    # 健康检查 (绕过限速)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
